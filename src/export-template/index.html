<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>__TITLE__</title>
<meta name="description" content="__DESCRIPTION__" />
<style>
  :root { --bg:#f6f5f2; --ink:#1c1b18; --muted:#5c594f; --line:#e5e2da; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:Georgia,serif; }
  header { max-width:1080px; margin:0 auto; padding:24px; }
  h1 { margin:0; font-size:32px; }
  .muted { color:var(--muted); }
  .badge { display:inline-block; border:1px solid var(--line); padding:1px 7px; font-size:12px;
           color:var(--muted); text-decoration:none; }
  main { max-width:1080px; margin:0 auto; padding:0 24px 64px; }
  #stage { position:relative; }
  #app { width:100%; height:min(78vh,860px); background:#e8e6e0; border-radius:4px; overflow:hidden;
         touch-action:none; display:none; }
  #app canvas { width:100%; height:100%; display:block; }
  #list-view { display:none; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:24px; }
  #list-view figure { margin:0; }
  #list-view img { width:100%; height:auto; display:block; background:var(--line); }
  #list-view figcaption { padding-top:8px; font-size:14px; }
  #hud { display:none; }
  #toggle-view { position:absolute; top:10px; right:10px; z-index:5; font:inherit; font-size:13px;
                 padding:8px 14px; background:rgba(255,255,255,0.85); border:1px solid var(--ink);
                 border-radius:2px; cursor:pointer; }
  #room-label { position:absolute; top:10px; left:12px; color:#fff; z-index:4;
                text-shadow:0 1px 3px rgba(0,0,0,0.6); font-size:14px; }
  #info-panel { display:none; position:absolute; left:12px; bottom:12px; max-width:340px; z-index:5;
                background:rgba(20,20,18,0.82); color:#f2f1ec; padding:14px 16px; border-radius:4px; }
  #info-panel p { margin:6px 0 0; font-size:13px; color:#cfcec6; }
  #info-panel a { color:#e8d9ae; }
  #info-panel button { margin-top:10px; background:transparent; color:#f2f1ec; font:inherit;
                       border:1px solid rgba(255,255,255,0.4); padding:4px 12px; font-size:12px; cursor:pointer; }
  #mini-map { position:absolute; right:12px; bottom:12px; width:200px; z-index:4;
              background:rgba(20,20,18,0.72); border:1px solid rgba(255,255,255,0.2);
              border-radius:4px; padding:6px; }
  #mini-map svg { display:block; width:100%; font-family:Georgia,serif; }
  #joystick { display:none; position:absolute; left:18px; bottom:18px; width:96px; height:96px; z-index:5;
              border-radius:50%; border:2px solid rgba(255,255,255,0.45);
              background:rgba(20,20,18,0.35); touch-action:none; }
  #donate { position:absolute; bottom:12px; right:224px; z-index:5; background:#8a4b2d; color:#fff;
            padding:8px 16px; border-radius:3px; font-size:13px; text-decoration:none; }
  footer { max-width:1080px; margin:0 auto; padding:16px 24px 40px; font-size:12px; color:var(--muted); }
  footer a { color:inherit; }
  noscript .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:24px; }
</style>
<script type="application/ld+json">__JSON_LD__</script>
</head>
<body>
<header>
  <h1>__TITLE__</h1>
  <p class="muted">by __CREATOR__</p>
  __STATEMENT_HTML__
</header>
<main>
  <div id="stage">
    <div id="app"></div>
    <div id="list-view"></div>
    <button id="toggle-view">List view</button>
    <div id="hud">
      <div id="room-label"></div>
      <div id="info-panel"></div>
      <div id="mini-map"></div>
      <div id="joystick"></div>
      __DONATE_LINK__
    </div>
  </div>
  <noscript>
    <p class="muted">This gallery's walkable view needs JavaScript. The works:</p>
    __NOSCRIPT_GRID__
  </noscript>
</main>
<footer>
  <span>__FOOTER_NOTE__</span>
</footer>
<script>window.GALLERY_DATA = __GALLERY_DATA__;</script>
<script type="module" src="./viewer.js"></script>
</body>
</html>
